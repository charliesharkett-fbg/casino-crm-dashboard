<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanatics Casino — CRM Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --black:#000;--white:#fff;--blue:#041E42;--silver:#D0D3D4;--gray:#707372;
  --glass:rgba(255,255,255,0.04);--glass-b:rgba(255,255,255,0.09);--glass-h:rgba(255,255,255,0.07);
  --muted:#707372;--dim:#D0D3D4;--green:#4ade80;--amber:#fbbf24;--blue-a:#60a5fa;
  --font-h:'Anton',sans-serif;--font-b:'Inter',sans-serif;
  --cat-xsell:rgba(255,255,255,0.35);--cat-promo:rgba(208,211,212,0.9);
  --cat-ret:#4ade80;--cat-life:rgba(255,255,255,0.75);--cat-tourn:#fbbf24;--cat-rev:rgba(251,191,36,0.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--font-b);font-size:13px;line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ── HEADER ── */
.hdr{background:rgba(4,30,66,0.97);backdrop-filter:blur(24px);border-bottom:1px solid var(--glass-b);
  padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200}
.logo{display:flex;align-items:center;gap:14px}
.logo-wm{font-family:var(--font-h);font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.logo-wm span{color:var(--silver)}
.logo-div{width:1px;height:26px;background:rgba(255,255,255,0.12)}
.logo-tag{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hdr-r{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--glass-b);
  border-radius:100px;padding:5px 14px;font-size:11px;font-weight:500;color:var(--dim)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(74,222,128,0)}}
.btn{font-family:var(--font-b);font-size:11px;font-weight:600;letter-spacing:.04em;padding:7px 16px;
  border-radius:6px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-w{background:var(--white);color:var(--black)}.btn-w:hover{background:var(--silver)}
.btn-g{background:var(--glass);border:1px solid var(--glass-b);color:var(--dim)}.btn-g:hover{background:var(--glass-h);color:var(--white)}
.btn-sm{padding:5px 12px;font-size:10px}

/* ── LAYOUT ── */
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px)}

/* ── SIDEBAR ── */
.sidebar{background:rgba(4,30,66,0.3);backdrop-filter:blur(12px);border-right:1px solid var(--glass-b);
  padding:1.5rem 0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;z-index:100}
.sb-sec{margin-bottom:1.75rem}
.sb-lbl{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  padding:0 1.25rem;margin-bottom:6px}
.nav{display:flex;align-items:center;gap:9px;padding:8px 1.25rem;font-size:12px;font-weight:400;
  color:var(--muted);cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.nav:hover{background:var(--glass);color:var(--dim)}
.nav.on{background:rgba(255,255,255,.05);color:var(--white);border-left-color:var(--white);font-weight:500}
.nav-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.nav-n{margin-left:auto;font-size:10px;background:rgba(255,255,255,.06);color:var(--muted);
  padding:1px 6px;border-radius:3px;font-weight:500}
.nav-n.w{background:rgba(251,191,36,.15);color:var(--amber)}
.sb-hr{border:none;border-top:1px solid var(--glass-b);margin:.75rem 1.25rem}

/* ── MAIN ── */
.main{padding:2rem;position:relative;z-index:1;min-width:0}

/* ── FILTER BAR ── */
.filter-bar{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);
  border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.5rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.filter-group{display:flex;align-items:center;gap:8px}
.filter-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:500;padding:4px 12px;border-radius:100px;border:1px solid rgba(255,255,255,.12);
  color:var(--muted);cursor:pointer;transition:all .15s;background:transparent;white-space:nowrap}
.chip:hover{border-color:rgba(255,255,255,.3);color:var(--dim)}
.chip.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:var(--white)}
.chip.cat-on-xsell{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4);color:var(--white)}
.chip.cat-on-promo{background:rgba(208,211,212,.12);border-color:rgba(208,211,212,.4);color:var(--silver)}
.chip.cat-on-ret{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.4);color:var(--green)}
.chip.cat-on-life{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:var(--white)}
.chip.cat-on-tourn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4);color:var(--amber)}
.chip.cat-on-rev{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:var(--amber)}
.filter-div{width:1px;height:24px;background:var(--glass-b)}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:6px 12px 6px 30px;font-family:var(--font-b);font-size:12px;
  color:var(--white);outline:none;transition:all .2s}
.search-input:focus{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.07)}
.search-input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}

/* ── WEEK RANGE ── */
.week-range{display:flex;align-items:center;gap:8px}
.week-select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:6px;padding:5px 10px;font-family:var(--font-b);font-size:11px;
  color:var(--dim);outline:none;cursor:pointer}
.week-select option{background:#041E42}

/* ── SECTION ── */
.sec{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:2rem 0 1rem;display:flex;align-items:center;gap:12px}
.sec::after{content:'';flex:1;height:1px;background:var(--glass-b)}

/* ── GLASS CARD ── */
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);
  border-radius:12px;padding:1.25rem;transition:border-color .2s,background .2s}
.card:hover{border-color:rgba(255,255,255,.14);background:var(--glass-h)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.125rem}
.card-title{font-family:var(--font-h);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ctag{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:100px;background:rgba(255,255,255,.08);color:var(--muted)}

/* ── KPI ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem}
.kpi{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);
  border-radius:12px;padding:1.125rem;transition:all .2s;animation:up .5s ease both}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.08s}
.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.16s}.kpi:nth-child(5){animation-delay:.2s}
.kpi:hover{background:var(--glass-h);border-color:rgba(255,255,255,.16)}
.kpi.warn{border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.03)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.kpi-lbl{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kpi-val{font-family:var(--font-h);font-size:28px;letter-spacing:.02em;line-height:1;transition:all .3s}
.kpi-sub{font-size:10px;margin-top:5px;color:var(--muted)}
.kpi-sub.up{color:var(--green)}.kpi-sub.dn{color:var(--amber)}.kpi-sub.w{color:var(--amber)}

/* ── GRIDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.g6040{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-bottom:1.5rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.5rem}

/* ── CHANNEL CARDS ── */
.ch-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-b);
  border-radius:12px;padding:1rem;transition:all .2s;cursor:pointer}
.ch-card:hover{background:var(--glass-h);border-color:rgba(255,255,255,.16)}
.ch-card.on{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07)}
.ch-lbl{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ch-val{font-family:var(--font-h);font-size:22px;color:var(--white);line-height:1;transition:all .3s}
.ch-or{font-size:10px;color:var(--muted);margin-top:4px}
.ch-bar{height:2px;background:rgba(255,255,255,.06);border-radius:1px;margin-top:10px}
.ch-bar-f{height:2px;border-radius:1px;background:rgba(255,255,255,.35);transition:width .4s}

/* ── CAT BARS ── */
.cat-list{display:flex;flex-direction:column;gap:11px}
.cat-row{display:grid;grid-template-columns:110px 1fr 62px 52px;align-items:center;gap:10px;cursor:pointer;padding:4px 6px;border-radius:6px;transition:background .15s}
.cat-row:hover{background:rgba(255,255,255,.04)}
.cat-row.active{background:rgba(255,255,255,.06)}
.cat-name{font-size:11px;font-weight:500;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.bar-f{height:4px;border-radius:2px;transition:width .4s}
.cat-num{font-size:10px;color:var(--muted);text-align:right}
.cat-or{font-size:10px;font-weight:600;color:var(--dim);text-align:right}
.cat-or.g{color:var(--green)}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 10px;border-bottom:1px solid var(--glass-b);white-space:nowrap;
  cursor:pointer;user-select:none;transition:color .15s}
th:hover{color:var(--dim)}
th.sort-asc::after{content:' ↑'}
th.sort-desc::after{content:' ↓'}
td{padding:8px 10px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;transition:background .15s}
tr:hover td{background:rgba(255,255,255,.025)}
td.td-n{color:var(--white);font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:100px;
  text-transform:uppercase;letter-spacing:.04em}
.b-xsell{background:rgba(255,255,255,.08);color:var(--dim)}
.b-promo{background:rgba(208,211,212,.12);color:var(--silver)}
.b-ret{background:rgba(74,222,128,.12);color:var(--green)}
.b-life{background:rgba(255,255,255,.13);color:var(--white)}
.b-tourn{background:rgba(251,191,36,.12);color:var(--amber)}
.b-rev{background:rgba(251,191,36,.08);color:var(--amber)}
.hi{color:var(--white);font-weight:600}.gr{color:var(--green);font-weight:600}.am{color:var(--amber);font-weight:600}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;gap:8px;margin-top:1rem;justify-content:flex-end}
.pg-btn{background:var(--glass);border:1px solid var(--glass-b);color:var(--dim);
  padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s}
.pg-btn:hover:not(:disabled){background:var(--glass-h);color:var(--white)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-info{font-size:11px;color:var(--muted)}

/* ── ALERTS ── */
.alerts,.recs{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;
  font-size:11px;line-height:1.5;border:1px solid}
.a-i{font-size:13px;flex-shrink:0;margin-top:1px}
.a-w{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.2);color:#fbbf24}
.a-n{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:var(--dim)}
.a-ok{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.2);color:#4ade80}
.alert strong{font-weight:600}
.rec{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;
  background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;
  font-size:11px;line-height:1.5;color:var(--dim)}
.rec-n{font-family:var(--font-h);font-size:22px;color:rgba(255,255,255,.1);line-height:1;flex-shrink:0;width:24px;margin-top:1px}
.rec strong{color:var(--white);font-weight:600}

/* ── UPLOAD ZONE ── */
.upload-zone{border:1.5px dashed rgba(255,255,255,.15);border-radius:12px;padding:2rem;
  text-align:center;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.02)}
.upload-zone:hover,.upload-zone.drag{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.05)}
.upload-zone p{font-size:12px;color:var(--muted);margin-top:.5rem}
.upload-zone strong{color:var(--dim);font-weight:600}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:12px}
.empty-icon{font-size:2rem;margin-bottom:.75rem;opacity:.3}

/* ── FOOTER ── */
.footer{margin-top:3rem;padding:1.5rem 0;border-top:1px solid var(--glass-b);
  display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}
.footer-logo{font-family:var(--font-h);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* ── DATA STATUS BAR ── */
.status-bar{display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding:.625rem 1rem;
  background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.15);border-radius:8px;
  font-size:11px;color:#4ade80}
.status-bar.warn{background:rgba(251,191,36,.06);border-color:rgba(251,191,36,.15);color:var(--amber)}
.status-bar span{color:var(--dim)}

/* ── TOOLTIP ── */
.tooltip{position:relative}
.tooltip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);background:rgba(4,30,66,.98);border:1px solid var(--glass-b);
  color:var(--dim);font-size:10px;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:999;pointer-events:none}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-wm">FANATICS <span>CASINO</span></div>
    <div class="logo-div"></div>
    <span class="logo-tag">CRM Analytics</span>
  </div>
  <div class="hdr-r">
    <div class="pill" id="dataStatus"><div class="live-dot"></div><span id="statusText">Loading data...</span></div>
    <button class="btn btn-g btn-sm" onclick="document.getElementById('uploadInput').click()">↑ Upload CSV</button>
    <input type="file" id="uploadInput" accept=".csv" style="display:none" onchange="handleUpload(event)">
    <button class="btn btn-w btn-sm" onclick="exportCSV()">↓ Export</button>
  </div>
</header>

<div class="wrap">
<nav class="sidebar">
  <div class="sb-sec">
    <div class="sb-lbl">Views</div>
    <div class="nav on" onclick="setView('overview')"><div class="nav-dot" style="background:var(--white)"></div>Overview</div>
    <div class="nav" onclick="setView('trends')"><div class="nav-dot" style="background:var(--silver)"></div>Trends</div>
    <div class="nav" onclick="setView('campaigns')"><div class="nav-dot" style="background:var(--dim)"></div>All Campaigns</div>
    <div class="nav" onclick="setView('insights')"><div class="nav-dot" style="background:var(--green)"></div>Insights</div>
  </div>
  <hr class="sb-hr">
  <div class="sb-sec">
    <div class="sb-lbl">Categories</div>
    <div class="nav" id="sb-all" onclick="setSidebarCat('all')"><div class="nav-dot" style="background:var(--white)"></div>All<span class="nav-n" id="sb-all-n">—</span></div>
    <div class="nav" id="sb-Cross-Sell" onclick="setSidebarCat('Cross-Sell')"><div class="nav-dot" style="background:rgba(255,255,255,.5)"></div>Cross-Sell<span class="nav-n" id="sb-Cross-Sell-n">—</span></div>
    <div class="nav" id="sb-Promo" onclick="setSidebarCat('Promo')"><div class="nav-dot" style="background:var(--silver)"></div>Promo<span class="nav-n" id="sb-Promo-n">—</span></div>
    <div class="nav" id="sb-Retention" onclick="setSidebarCat('Retention')"><div class="nav-dot" style="background:var(--green)"></div>Retention<span class="nav-n" id="sb-Retention-n">—</span></div>
    <div class="nav" id="sb-Lifecycle" onclick="setSidebarCat('Lifecycle')"><div class="nav-dot" style="background:rgba(255,255,255,.7)"></div>Lifecycle<span class="nav-n" id="sb-Lifecycle-n">—</span></div>
    <div class="nav" id="sb-Tournaments" onclick="setSidebarCat('Tournaments')"><div class="nav-dot" style="background:var(--amber)"></div>Tournaments<span class="nav-n" id="sb-Tournaments-n">—</span></div>
    <div class="nav" id="sb-REVIEW" onclick="setSidebarCat('REVIEW')"><div class="nav-dot" style="background:var(--amber);opacity:.6"></div>REVIEW<span class="nav-n w" id="sb-REVIEW-n">—</span></div>
  </div>
  <hr class="sb-hr">
  <div class="sb-sec">
    <div class="sb-lbl">Channels</div>
    <div class="nav on" id="ch-nav-email" onclick="setChannel('email')"><div class="nav-dot" style="background:rgba(255,255,255,.7)"></div>Email</div>
    <div class="nav" id="ch-nav-push" onclick="setChannel('push')"><div class="nav-dot" style="background:var(--silver)"></div>Push</div>
    <div class="nav" id="ch-nav-iam" onclick="setChannel('iam')"><div class="nav-dot" style="background:var(--green)"></div>IAM</div>
    <div class="nav" id="ch-nav-inbox" onclick="setChannel('inbox')"><div class="nav-dot" style="background:var(--muted)"></div>Inbox</div>
  </div>
</nav>

<main class="main" id="mainContent">
  <!-- Populated by JS -->
  <div class="empty"><div class="empty-icon">⟳</div><div>Loading dashboard...</div></div>
</main>
</div>

<script>
// ── DATA STORE ──
let RAW_DATA = [];
let FILTERED = [];
let state = {
  view: 'overview',
  category: 'all',
  channel: 'email',
  weekFrom: '',
  weekTo: '',
  search: '',
  sortCol: 'email_opened',
  sortDir: 'desc',
  page: 1,
  pageSize: 20
};

const CAT_COLORS = {
  'Cross-Sell':'rgba(255,255,255,0.4)',
  'Promo':'rgba(208,211,212,0.9)',
  'Retention':'rgba(74,222,128,0.85)',
  'Lifecycle':'rgba(255,255,255,0.75)',
  'Tournaments':'rgba(251,191,36,0.8)',
  'REVIEW':'rgba(251,191,36,0.45)',

// ── CSV UPLOAD ──
function handleUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const rows = parseCSV(ev.target.result);
    if (rows.length > 0) {
      RAW_DATA = rows;
      FILTERED = applyFilters(rows);
      populateSidebarCounts();
      renderView();
      document.getElementById('statusText').textContent = `${rows.length} campaigns loaded from ${file.name}`;
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,''));
  const results = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(',');
    const row = {};
    headers.forEach((h, idx) => { row[h] = (vals[idx]||'').trim().replace(/"/g,''); });
    // Map to standard fields
    const mapped = {
      week: row['Sport'] || row['week'] || '',
      category: row[''] || row['category_label'] || '',
      label: row['Sub Label'] || row['label'] || '',
      title: row['title'] || '',
      email_sent: +row['email_sent']||0,
      email_opened: +row['email_opened']||0,
      email_clicked: +row['email_clicked']||0,
      email_or: +row['email_open_rate']||0,
      push_sent: +row['mobile_push_sent']||0,
      push_opened: +row['mobile_push_opened']||0,
      iam_sent: +row['inapp_sent']||0,
      iam_opened: +row['inapp_opened']||0,
      inbox_sent: +row['inbox_sent']||0,
      inbox_opened: +row['inbox_opened']||0,
    };
    if (mapped.title) results.push(mapped);
  }
  return results;
}

// ── FILTERS ──
function applyFilters(data) {
  return data.filter(r => {
    if (state.category !== 'all' && r.category !== state.category) return false;
    if (state.weekFrom && r.week && r.week < state.weekFrom) return false;
    if (state.weekTo && r.week && r.week > state.weekTo) return false;
    if (state.search && !r.title.toLowerCase().includes(state.search.toLowerCase()) &&
        !r.label.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
}

    <div class="filter-group">
      <div class="filter-label">Category</div>

// ── CAMPAIGN TABLE ──
function renderCampaignTable(data, sortable=false) {
  const cols = [
    {key:'title',label:'Campaign',cls:'td-n'},
    {key:'category',label:'Category'},
    {key:'week',label:'Week'},
    {key:'email_sent',label:'Email Sent'},
    {key:'email_opened',label:'Opens'},
    {key:'email_or',label:'OR %'},
    {key:'email_clicked',label:'Clicked'},
    {key:'push_sent',label:'Push Sent'},
    {key:'push_opened',label:'Push Opens'},
  ];

  const badgeClass = {'Cross-Sell':'b-xsell','Promo':'b-promo','Retention':'b-ret','Lifecycle':'b-life','Tournaments':'b-tourn','REVIEW':'b-rev'};

  return `<div class="tbl-wrap"><table>
    <thead><tr>
      ${cols.map(c=>`<th ${sortable?`onclick="sortBy('${c.key}')" class="${state.sortCol===c.key?'sort-'+state.sortDir:''}"`:''} >${c.label}</th>`).join('')}
    </tr></thead>
    <tbody>
      ${data.length === 0 ? `<tr><td colspan="${cols.length}" style="text-align:center;padding:2rem;color:var(--muted)">No campaigns match the current filters</td></tr>` :
      data.map(r=>`<tr>
        <td class="td-n" title="${r.title}">${r.title}</td>
        <td><span class="badge ${badgeClass[r.category]||''}">${r.category||'—'}</span></td>
        <td>${r.week||'—'}</td>
        <td>${r.email_sent?fmt(r.email_sent):'—'}</td>
        <td class="${r.email_opened>50000?'hi':''}">${r.email_opened?fmt(r.email_opened):'—'}</td>
        <td class="${parseFloat(r.email_or)>=38?'gr':parseFloat(r.email_or)<30?'am':''}">${r.email_or?parseFloat(r.email_or).toFixed(1)+'%':'—'}</td>
        <td>${r.email_clicked?fmt(r.email_clicked):'—'}</td>
        <td>${r.push_sent?fmt(r.push_sent):'—'}</td>
        <td class="${r.push_opened>5000?'gr':''}">${r.push_opened?fmt(r.push_opened):'—'}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

          x:{ticks:{color:lc,font,maxRotation:0,maxTicksLimit:14},grid:{color:gc},border:{display:false}},

        scales:{
          x:{ticks:{color:lc,font,maxRotation:0,maxTicksLimit:14},grid:{color:gc},border:{display:false}},

// ── HELPERS ──
function fmt(n) {
  if (!n) return '—';
  if (n >= 1000000) return (n/1000000).toFixed(1)+'M';
  if (n >= 1000) return (n/1000).toFixed(0)+'K';
  return n.toLocaleString();
}

function sortData(data) {
  return [...data].sort((a,b) => {
    let av = a[state.sortCol]||0, bv = b[state.sortCol]||0;
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    return state.sortDir==='asc' ? (av>bv?1:-1) : (av<bv?1:-1);
  });
}

function sortBy(col) {
  if (state.sortCol === col) state.sortDir = state.sortDir==='desc'?'asc':'desc';
  else { state.sortCol=col; state.sortDir='desc'; }
  state.page = 1;
  renderView();
}

function changePage(dir) {
  state.page = Math.max(1, state.page + dir);
  renderView();
}

function setWeekFilter() {
  state.weekFrom = document.getElementById('weekFrom')?.value || '';
  state.weekTo = document.getElementById('weekTo')?.value || '';
  state.page = 1;
  FILTERED = applyFilters(RAW_DATA);
  renderView();
}

function clearWeeks() {
  state.weekFrom = ''; state.weekTo = '';
  state.page = 1;
  FILTERED = applyFilters(RAW_DATA);
  renderView();
}

function handleSearch(val) {
  state.search = val;
  state.page = 1;
  FILTERED = applyFilters(RAW_DATA);
  renderView();
}

function clearAllFilters() {
  state.category = 'all'; state.weekFrom = ''; state.weekTo = ''; state.search = '';
  state.page = 1;
  FILTERED = applyFilters(RAW_DATA);
  // Reset sidebar
  document.querySelectorAll('.sidebar .nav[id^="sb-"]').forEach(n => n.classList.remove('on'));
  const allNav = document.getElementById('sb-all');
  if (allNav) allNav.classList.add('on');
  renderView();
}

function attachEventListeners() {
  // Drag and drop on upload zone
  const zone = document.getElementById('dropZone');
  if (zone) {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag');
      if (e.dataTransfer.files[0]) {
        const input = document.getElementById('uploadInput');
        // Create synthetic event
        const dt = new DataTransfer();
        dt.items.add(e.dataTransfer.files[0]);
        input.files = dt.files;
        handleUpload({target: input});
      }
    });
  }
}

function exportCSV() {
  const data = FILTERED.length > 0 ? FILTERED : TOP_CAMPAIGNS;
  const headers = ['week','category','label','title','email_sent','email_opened','email_or','email_clicked','push_sent','push_opened'];
  const rows = [headers.join(','), ...data.map(r => headers.map(h => r[h]||'').join(','))];
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `casino_crm_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
